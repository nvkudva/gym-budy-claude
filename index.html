<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gym Buddy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- SVG Lens Filter — from CodePen glass technique by wprod -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display:none;position:absolute;width:0;height:0">
      <filter id="lensFilter" x="0%" y="0%" width="100%" height="100%" filterUnits="objectBoundingBox">
        <feComponentTransfer in="SourceAlpha" result="alpha">
          <feFuncA type="identity" />
        </feComponentTransfer>
        <feGaussianBlur in="alpha" stdDeviation="40" result="blur" />
        <feDisplacementMap in="SourceGraphic" in2="blur" scale="30" xChannelSelector="A" yChannelSelector="A" />
      </filter>
    </svg>
  </body>
</html>
